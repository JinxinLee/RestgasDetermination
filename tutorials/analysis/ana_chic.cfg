DefineList Eta
  decayMode eta -> gamma gamma
  daughterList Neutral
  daughterList Neutral
  histogram 0.1
  select Mass 0.547 0.2
End

DefineList Jpsi
  decayMode J/psi -> gamma eta pi+ pi-
  daughterList Neutral
  daughterList Eta
  daughterList PionVeryLoose
  daughterList PionVeryLoose
  histogram 0.15
  select Mass 3.096 0.2
End

DefineList Chi_c
  decayMode chi_c0 -> J/psi gamma
  daughterList Jpsi
  daughterList Neutral
  histogram 0.15
  select Mass 3.415 0.2
End

dumpList Chi_c			chi		p4 p3cm pos m
dumpList Jpsi			jpsi	p4 p3cm m miss
dumpList Eta			eta		p4 p3cm m miss
dumpList Neutral		gam		p4 p3cm mci
dumpList PionVeryLoose	pi		p4 p3 p3cm m ch mci pid
 
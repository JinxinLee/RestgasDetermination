DefineList PhiToKK 
  decayMode phi -> K+ K-
  daughterList KaonVeryLoose
  daughterList KaonVeryLoose
  histogram 0.98 1.06
  select Mass 1.0195 0.03
EndDefine

DefineList DsToPhiPi
  decayMode D_s+ -> phi pi+
  daughterList PhiToKK
  daughterList PionVeryLoose
  histogram 1.868 2.068
  select Mass 1.9685 0.02
EndDefine

DefineList Pi0
  decayMode pi0 -> gamma gamma
  daughterList Neutral
  daughterList Neutral
  histogram 0.105 0.165
  select Mass 0.135 0.03
EndDefine

DefineList Ds0ToDspi0
  decayMode D_s0*+ -> D_s+ pi0
  daughterList DsToPhiPi
  daughterList Pi0
  histogram 2.217 2.417
EndDefine

DefineList pbarpToDs0Ds
  decayMode pbarpSystem -> D_s0*+ D_s-
  daughterList Ds0ToDspi0
  daughterList DsToPhiPi
  histogram 4.185 4.385
EndDefine

Ecms 4.291

dumpList 	PhiToKK 		phi 	p4 p4cm p3 p3cm m miss
dumpList 	DsToPhiPi 		ds 		ch p4 p4cm p3 p3cm m miss
dumpList 	Pi0 			pi0 	p4 p4cm p3 p3cm m miss
dumpList 	Ds0ToDspi0 		ds0 	ch p4 p4cm p3 p3cm m miss
dumpList 	pbarpToDs0Ds 	pp 		p4 p4cm p3 p3cm m miss

dumpList 	Neutral 		gam 	p4 p4cm p3 p3cm mci
dumpList 	PionVeryLoose 	pi 		ch p4 p4cm p3 p3cm m mci
dumpList 	KaonVeryLoose 	k 		ch p4 p4cm p3 p3cm m mci

dumpList 	McTruth			mct

Ecms 4.291

DefineList PhiToKK 
  decayMode phi -> K+ K-
  daughterList KaonVeryLoose
  daughterList KaonVeryLoose
  histogram 0.98 1.06
  select Mass 1.0195 0.03
End

DefineList DsToPhiPi
  decayMode D_s+ -> phi pi+
  daughterList PhiToKK
  daughterList PionVeryLoose
  histogram 1.8685 2.0685
End

dumpList 	PhiToKK 		phi		p4 p3cm m miss 
dumpList	DsToPhiPi		ds		p4 p3cm m miss ch dm
dumpList	KaonVeryLoose	k		p4 p3cm	mci pid pidlh
dumpList	PionVeryLoose	pi		p4 p3cm mci pid pidlh
dumpList	McTruth			mc		p4 p3cm
DefineList PhiToKK 
  decayMode phi -> K+ K-
  daughterList KaonLoose
  daughterList KaonLoose
  histogram 0.98 1.06
  select Mass 0.1 1.5
End

DefineList DsToPhiPi
  decayMode D_s+ -> phi pi+
  daughterList PhiToKK
  daughterList PionVeryLoose
  histogram 0.03
  select Mass 0.06
End

DefineList Pi0
  decayMode pi0 -> gamma gamma
  daughterList Neutral
  daughterList Neutral
  histogram 0.11 0.16
  select Mass 0.06
End

DefineList Ds0ToDspi0
  decayMode D*_0s+ -> D_s+ pi0
  daughterList DsToPhiPi
  daughterList Pi0
  histogram 2.217 2.417
  select Mass 0.2
End

DefineList pbarpToDs0Ds
  decayMode pbarp -> D*_0s+ D_s-
  daughterList Ds0ToDspi0
  daughterList DsToPhiPi
  dumpList
  histogram 4.185 4.385
End


DefineList Eta
  decayMode eta -> gamma gamma
  daughterList Neutral
  daughterList Neutral
  histogram 0.1
  select Mass 0.547 0.04
End

DefineList Jpsi
  decayMode J/psi -> gamma eta pi+ pi-
  daughterList Neutral
  daughterList Eta
  daughterList PionVeryLoose
  daughterList PionVeryLoose
  histogram 0.15
  select Mass 3.096 0.04
End

DefineList Chi_c
  decayMode chi_c0 -> J/psi gamma
  daughterList Jpsi
  daughterList Neutral
  histogram 0.15
End

dumpList PionVeryLoose k p4 p3cm mci
dumpList Neutral 
# Trigger line definitions for PndSoftTriggerTask
# NOTE: - If a field should be left emtpy, put at least some white space between colons
#       - A line can be commented out by a # as _first_ character in the line
#
# Meaning of columns are:
#  name    = arbitrary, but ideally unique name of the mode
#  decay   = decay pattern with EvtGen names, the arrow must be exactly '->'; cc as last item sets the charged conjugation flag
#  prefix  = prefix for candidate branches in the RhoTuple 
#  ntpname = name of the QA ntuple in ROOT file
#  qamin   = min mass cut for the QA tuple; if given with a sign (+/-) in front, it's relative to mean
#  qamax   = max mass cut for the QA tuple; if given with a sign (+/-) in front, it's relative to mean
#  mean    = mean value of the invariant mass distribution of reco'd candidates to be used in final mass selection; 'Ecm' -> mean = sqrt(s)
#  sigma   = sigma value of the invariant mass distribution of reco'd candidates to be used in final mass selection
#  thresh  = threshold sqrt(s) for the tagger to be run
#  nsig    = +- nsig sigmas mass cut for final selection
#  fqa     = default QA output flag (can be overwritten in PndSoftTriggerTask)
#  ftag    = default for tag status (active/inactive)

